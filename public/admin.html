<!DOCTYPE html>
<html><head><title>Admin Login</title>
<style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#0f0f0f;margin:0} .box{background:white;padding:25px;border-radius:15px;width:300px;text-align:center} input{width:100%;padding:11px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box} button{width:100%;padding:12px;background:#25D366;border:none;border-radius:10px;font-weight:bold;cursor:pointer}</style>
</head><body>
<div class="box">
<h2>🔐 Admin Login</h2>
<p style="font-size:13px">Jam Danish - SMM Panel</p>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg" style="color:red;font-size:13px"></p>
<p style="font-size:11px">Demo: admin / Jam123</p>
</div>
<script>
function login(){
  let u = document.getElementById('user').value;
  let p = document.getElementById('pass').value;
  if(u=='admin' && p=='Jam123'){
    localStorage.setItem('jam_admin','yes');
    window.location.href='dashboard.html';
  } else {
    document.getElementById('msg').innerText='Galat Username ya Password hai!';
  }
}
</script>
</body></html>
