<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f4f4;margin:0}
.box{background:white;padding:25px;border-radius:12px;width:300px;text-align:center;box-shadow:0 0 10px #ccc}
input{width:90%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
button{width:95%;padding:11px;background:black;color:white;border:none;border-radius:6px;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Admin Login</h2>
<p style="font-size:13px">Jam Danish - SMM Panel</p>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg" style="color:red;font-size:13px"></p>
<p style="font-size:11px">Demo: admin / Jam123</p>
</div>
<script>
function login(){
  let u = document.getElementById('user').value;
  let p = document.getElementById('pass').value;
  if(u=='admin' && p=='Jam123'){
    localStorage.setItem('jam_admin','yes');
    window.location.href='dashboard.html';
  } else {
    document.getElementById('msg').innerText='Galat Username ya Password';
  }
}
</script>
</body>
</html>
