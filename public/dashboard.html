<!DOCTYPE html>
<html>
<head>
<title>Admin - Jam Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#111;color:white;padding:15px}
.box{background:#222;padding:16px;border-radius:12px;max-width:600px;margin:10px auto}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:8px}
.btn-green{background:#22c55e;color:white}
.btn-red{background:#ef4444;color:white}
input{width:95%;padding:11px;border-radius:8px;border:none;margin:6px 0}
</style>
</head>
<body>
<h2 style="text-align:center">👑 ADMIN - JAM PANEL</h2>
<div class="box"><b>Total Orders: 24 | Pending: 2 | Balance: Rs 12500</b><br><br>
<p>Last Payment: <b id="lp">Koi payment nahi aayi</b></p>
<button class="btn-green" onclick="approve()">✅ Payment Approve Karo - Balance Add Karo</button>
<button class="btn-red" onclick="alert('Order Reject Kar Diya')">❌ Reject Karo</button>
</div>
<div class="box">
<b>🎤 Voice Assistant - Admin</b>
<p id="amsg">Salam Boss! Bolo kya karna hai?</p>
<button class="btn-green" onclick="speak('Salam Boss, aj 24 orders aaye hain, 2 pending hain, 1 nayi payment aayi hai')">🔊 Bol Kar Batao</button>
<input id="q" placeholder="Likho ya Bolo...">
<button class="btn-green" onclick="ask()">Send</button>
<button class="btn-green" onclick="startVoice()">🎤 Bolo</button>
</div>
<script>
document.getElementById('lp').innerText = localStorage.getItem('last_payment') || 'Koi payment nahi aayi';
function approve(){ let p=localStorage.getItem('last_payment'); if(!p){ alert('Koi payment nahi hai'); return; } alert('Approve Ho Gaya: '+p); speak('Payment approve ho gayi hai'); }
function speak(t){ document.getElementById('amsg').innerText=t; let u=new SpeechSynthesisUtterance(t); u.lang='ur-PK'; window.speechSynthesis.speak(u); }
function ask(){ let q=document.getElementById('q').value.toLowerCase(); let a='Aj 24 orders aaye hain.'; if(q.includes('balance')) a='Total balance 12500 rupay hai.'; if(q.includes('order')) a='2 orders pending hain, approve dabao.'; if(q.includes('payment')) a='Ek nayi payment aayi hai, usko approve karo.'; speak(a); }
function startVoice(){ let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); rec.lang='ur-PK'; rec.onresult=function(e){ document.getElementById('q').value=e.results[0][0].transcript; ask(); }; rec.start(); }
</script>
</body>
</html>
