<!DOCTYPE html>
<html>
<head>
<title>Jam SMM Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#f4f4f4;margin:0;padding:15px}
.box{background:white;padding:18px;border-radius:12px;max-width:500px;margin:auto}
.card{background:#111;color:white;padding:15px;border-radius:12px;margin:10px 0;cursor:pointer}
.card:hover{background:#22c55e}
button{width:100%;padding:12px;background:black;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold}
input,select{width:95%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
#chat{background:#eef;padding:10px;border-radius:12px;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h2>🔥 Jam SMM Panel</h2>
<p>Balance: <b>Rs <span id="cbal">500</span></b> <button onclick="addBal()" style="width:auto;padding:5px 10px;background:green">+ Add</button></p>

<h3>⚡ Trending Services - Click Karo</h3>
<div class="card" onclick="selectSrv('Instagram Followers - Rs 150')">📸 Instagram Followers - Rs 150 / 1k 🔥</div>
<div class="card" onclick="selectSrv('TikTok Likes - Rs 120')">🎵 TikTok Likes - Rs 120 / 1k 🔥</div>
<div class="card" onclick="selectSrv('YouTube Views - Rs 200')">▶️ YouTube Views - Rs 200 / 1k 🔥</div>

<select id="srv"><option>Instagram Followers - Rs 150</option><option>TikTok Likes - Rs 120</option><option>YouTube Views - Rs 200</option></select>
<input id="link" placeholder="Apna Link Yahan Paste Karo">
<input id="qty" type="number" placeholder="Quantity e.g 1000">
<button onclick="placeOrder()">Order Place Karo 🚀</button>
<p id="msg" style="color:green"></p>

<div id="chat">
<b>🤖 Jam Assistant</b>
<p id="amsg" style="font-size:13px">Salam! Order karne ke liye Service select karo, Link dalo, Order dabao.</p>
<input id="q" placeholder="Assistant se poocho...">
<button onclick="ask()">Ask Assistant</button>
</div>
</div>

<script>
let bal = 500;
function selectSrv(v){ document.getElementById('srv').value=v; alert(v+' Select Ho Gaya ✅'); }
function addBal(){ let a=prompt('Kitna Add Karna Hai?'); if(a){ bal+=Number(a); document.getElementById('cbal').innerText=bal; } }
function placeOrder(){
  let l=document.getElementById('link').value;
  if(!l){ alert('Pehle Link Dalo'); return; }
  document.getElementById('msg').innerText='✅ Order Place Ho Gaya! 5 Min Me Start Hoga.';
}
function ask(){
  let q=document.getElementById('q').value.toLowerCase();
  let a='Service select karo, Link dalo, Order dabao. Balance ke liye + Add dabao.';
  if(q.includes('balance')) a='Apka Balance Rs '+bal+' hai.';
  if(q.includes('order')) a='Apka Order Pending me hai, 5 min me start hoga.';
  if(q.includes('price')) a='Sab se sasta: TikTok Likes Rs 120 / 1k.';
  document.getElementById('amsg').innerText=a;
}
</script>
</body>
</html>
