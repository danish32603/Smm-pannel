<!DOCTYPE html>
<html><head><title>My Orders</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:sans-serif;background:#f4f4f4;padding:12px}.box{background:white;padding:14px;border-radius:12px;margin:10px 0}</style></head>
<body><h2>📦 My Orders</h2><div id="list"></div><button onclick="window.location.href='index.html'" style="width:100%;padding:12px;background:black;color:white;border:none;border-radius:8px">+ New Order</button>
<script>
let orders = JSON.parse(localStorage.getItem('jam_orders')||'[]');
if(orders.length==0) orders=[{id:12345,service:'Instagram Followers',link:'instagram.com/jam',qty:1000,status:'Completed'},{id:12346,service:'TikTok Likes',link:'tiktok.com/@jam',qty:500,status:'In Progress'},{id:12347,service:'YouTube Views',link:'youtube.com/@jam',qty:2000,status:'Pending'}];
document.getElementById('list').innerHTML=orders.map(o=>`<div class="box"><b>#${o.id} - ${o.service}</b><br>Link: ${o.link}<br>Qty: ${o.qty} | Status: <b style="color:green">${o.status}</b></div>`).join('');
</script></body></html>
